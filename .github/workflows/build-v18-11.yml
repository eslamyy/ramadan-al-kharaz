name: Build Ramadan Al Kharaz V18.11

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Find V18.11 ZIP
        id: findzip
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -type f \( \
            -iname "*V18_11*.zip" -o \
            -iname "*V18.11*.zip" -o \
            -iname "*V18-11*.zip" \
          \) | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: V18.11 ZIP file not found"
            echo "ZIP files available:"
            find . -type f -iname "*.zip" -print
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"
          echo "zip=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract project
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          unzip -q "${{ steps.findzip.outputs.zip }}" -d extracted

          echo "Extracted files:"
          find extracted -maxdepth 4 -type f | head -100

      - name: Locate Android project
        id: project
        shell: bash
        run: |
          set -e

          SETTINGS=$(find extracted -type f \( \
            -name "settings.gradle" -o \
            -name "settings.gradle.kts" \
          \) | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Android Gradle project not found inside ZIP"
            find extracted -maxdepth 6 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Android project found at: $PROJECT_DIR"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Setup Android SDK
        shell: bash
        run: |
          set -e

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"

          if [ -z "$SDK_ROOT" ]; then
            echo "ERROR: Android SDK path not found"
            exit 1
          fi

          echo "Android SDK path: $SDK_ROOT"

          SDKMANAGER=$(find "$SDK_ROOT" \
            -type f \
            -name sdkmanager \
            | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            find "$SDK_ROOT" -maxdepth 6 -type f | head -100
            exit 1
          fi

          SDKMANAGER_DIR=$(dirname "$SDKMANAGER")

          echo "$SDKMANAGER_DIR" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/emulator" >> "$GITHUB_PATH"

          "$SDKMANAGER" --licenses > /dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Build APK
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -e

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew clean assembleDebug
          else
            gradle clean assembleDebug
          fi

      - name: Find APK
        id: apk
        shell: bash
        run: |
          set -e

          APK=$(find extracted -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK file was not created"
            find extracted -type f -name "*.apk"
            exit 1
          fi

          echo "APK found: $APK"
          echo "path=$APK" >> "$GITHUB_OUTPUT"

      - name: Prepare APK
        shell: bash
        run: |
          set -e

          mkdir -p final-apk

          cp "${{ steps.apk.outputs.path }}" \
            "final-apk/Ramadan-Al-Kharaz-V18.11.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ramadan-Al-Kharaz-V18.11-APK
          path: final-apk/Ramadan-Al-Kharaz-V18.11.apk
          if-no-files-found: error
