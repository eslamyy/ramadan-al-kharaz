name: Build V18.4 Logos Fixed APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "Ramadan_Al_Kharaz_V18_4_LOGOS_FIXED.zip"
      - ".github/workflows/build-v18-zip.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Extract V18.4 project
        run: |
          rm -rf v18-build
          mkdir v18-build
          unzip -q Ramadan_Al_Kharaz_V18_4_LOGOS_FIXED.zip -d v18-build

      - name: Detect Android project
        shell: bash
        run: |
          SETTINGS_FILE=$(find v18-build -type f -name "settings.gradle" | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project found at: $PROJECT_DIR"

      - name: Build V18.4 APK
        run: |
          gradle -p "$PROJECT_DIR" :app:assembleDebug --stacktrace

      - name: Upload V18.4 APK
        uses: actions/upload-artifact@v4
        with:
          name: Ramadan-Al-Kharaz-V18.4-Logos-Fixed-APK
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
