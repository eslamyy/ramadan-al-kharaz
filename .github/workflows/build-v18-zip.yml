name: Build V18.7 APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Extract V18.7 project
        run: |
          rm -rf v18-build
          mkdir -p v18-build
          unzip ".github/workflows/Ramadan_Al_Kharaz_V18_7_SEARCH_INVENTORY_WAREHOUSE.zip" -d v18-build

      - name: Show extracted files
        run: |
          echo "===== Extracted files ====="
          find v18-build -maxdepth 3 -type f | head -100
          echo "==========================="

      - name: Detect Android project
        id: detect
        run: |
          PROJECT_DIR=$(find v18-build -type f -name "gradlew" -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR=$(find v18-build -type f -name "settings.gradle" -printf '%h\n' | head -n 1)
          fi

          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR=$(find v18-build -type f -name "settings.gradle.kts" -printf '%h\n' | head -n 1)
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project not found."
            find v18-build -maxdepth 4 -type f
            exit 1
          fi

          echo "Android
