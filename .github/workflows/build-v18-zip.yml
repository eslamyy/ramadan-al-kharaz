name: Build V18.7 Search Inventory Warehouse APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "Ramadan_Al_Kharaz_V18_7_SEARCH_INVENTORY_WAREHOUSE.zip"
      - ".github/workflows/build-v18-zip.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Extract V18.7 project
        shell: bash
        run: |
          rm -rf v18-build
          mkdir -p v18-build
          unzip -q "Ramadan_Al_Kharaz_V18_7_SEARCH_INVENTORY_WAREHOUSE.zip" -d v18-build

      - name: Detect Android project
        shell: bash
        run: |
          SETTINGS_FILE=$(find v18-build -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle not found"
            find v18-build -maxdepth 4 -type f | head -100
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project found at: $PROJECT_DIR"

      - name: Build V18.7 APK
        shell: bash
        run: |
          gradle -p "$PROJECT_DIR" :app:assembleDebug --stacktrace

      - name: Find generated APK
        shell: bash
        run: |
          find "$PROJECT_DIR" -type f -name "*.apk" -print

      - name: Upload V18.7 APK
        uses: actions/upload-artifact@v4
        with:
          name: Ramadan-Al-Kharaz-V18.7-Search-APK
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
