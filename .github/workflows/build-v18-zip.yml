name: Build Ramadan Al Kharaz V18.11

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Find V18.11 ZIP
        id: findzip
        shell: bash
        run: |
          set -e
          ZIP_FILE=$(find . -maxdepth 2 -type f \
            -iname "*V18_11*zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: V18.11 ZIP file not found"
            echo "ZIP files available:"
            find . -maxdepth 2 -type f -iname "*.zip" -print
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"
          echo "zip=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract project
        shell: bash
        run: |
          set -e
          rm -rf extracted
          mkdir extracted
          unzip -q "${{ steps.findzip.outputs.zip }}" -d extracted

          echo "Extracted files:"
          find extracted -maxdepth 3 -type f | head -100

      - name: Locate Android project
        id: project
        shell: bash
        run: |
          set -e

          SETTINGS=$(find extracted -type f \
            -name "settings.gradle" -o -name "settings.gradle.kts" \
            | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Android Gradle project not found inside ZIP"
            exit 1
