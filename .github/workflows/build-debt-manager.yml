name: Build Debt Manager APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "Debt_Manager_Standalone_Android_V1.zip"
      - ".github/workflows/build-debt-manager.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Extract Debt Manager project
        run: |
          rm -rf debt-build
          mkdir debt-build
          unzip -q Debt_Manager_Standalone_Android_V1.zip -d debt-build
          echo "=== Extracted files ==="
          find debt-build -maxdepth 4 -type f | head -100

      - name: Detect Android project
        shell: bash
        run: |
          SETTINGS_FILE=$(find debt-build -type f -name "settings.gradle" | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle not found"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project found at: $PROJECT_DIR"

      - name: Build Debt Manager APK
        run: |
          gradle -p "$PROJECT_DIR" :app:assembleDebug --stacktrace

      - name: Find generated APK
        run: |
          echo "=== Generated APK files ==="
          find "$PROJECT_DIR" -type f -name "*.apk" -print

      - name: Upload Debt Manager APK
        uses: actions/upload-artifact@v4
        with:
          name: Debt-Manager-Standalone-APK
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
