name: Build Clean Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "ramadan_al_kharaz_professional_v6.zip"
      - ".github/workflows/build-clean.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Extract clean project
        run: |
          rm -rf clean-build
          mkdir clean-build
          unzip -q ramadan_al_kharaz_professional_v6.zip -d clean-build

      - name: Build APK
        run: |
          gradle -p clean-build :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ramadan-Al-Kharaz-Clean-V1-APK
          path: clean-build/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
