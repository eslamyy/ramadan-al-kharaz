name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "ramadan_android_project_inventory_v3.zip"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract Android project
        run: |
          rm -rf android-build
          mkdir android-build
          unzip -q ramadan_android_project_inventory_v3.zip -d android-build
          echo "Project contents:"
          find android-build -maxdepth 4 -type f | head -100

      - name: Find and build Android project
        run: |
          GRADLEW=$(find android-build -type f -name gradlew | head -1)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew not found"
            find android-build -maxdepth 5 -type f
            exit 1
          fi

          echo "Found Gradle wrapper at: $GRADLEW"

          PROJECT_DIR=$(dirname "$GRADLEW")
          chmod +x "$GRADLEW"

          cd "$PROJECT_DIR"
          ./gradlew :app:assembleDebug --stacktrace

      - name: Find APK
        run: |
          echo "Generated APK files:"
          find android-build -type f -name "*.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ramadan-Al-Kharaz-APK
          path: |
            android-build/**/*.apk
          if-no-files-found: error
