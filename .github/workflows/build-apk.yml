name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "ramadan_android_project_inventory_v3.zip"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract Android project
        run: |
          rm -rf android-build
          mkdir android-build
          unzip -q ramadan_android_project_inventory_v3.zip -d android-build

      - name: Make Gradle executable
        run: chmod +x android-build/gradlew

      - name: Build APK
        run: |
          cd android-build
          ./gradlew :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ramadan-Al-Kharaz-APK
          path: android-build/app/build/outputs/apk/debug/app-debug.apk
