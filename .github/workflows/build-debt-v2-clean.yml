name: Build Debt Manager V2 Clean APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "Debt_Manager_Standalone_V2_CLEAN.zip"
      - ".github/workflows/build-debt-v2-clean.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Extract V2 Clean project
        run: |
          rm -rf debt-v2-build
          mkdir debt-v2-build
          unzip -q Debt_Manager_Standalone_V2_CLEAN.zip -d debt-v2-build
          echo "Project extracted successfully"
          find debt-v2-build -maxdepth 4 -type f -name "settings.gradle*" -print

      - name: Detect Android project
        shell: bash
        run: |
          SETTINGS_FILE=$(find debt-v2-build -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) | head -n 1)
          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: Android project settings file not found"
            find debt-v2-build -maxdepth 4 -type f | head -100
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project found at: $PROJECT_DIR"

      - name: Build Debt Manager APK
        run: |
          gradle -p "$PROJECT_DIR" :app:assembleDebug --stacktrace

      - name: Find generated APK
        run: |
          echo "Generated APK files:"
          find "$PROJECT_DIR" -type f -name "*.apk" -print

      - name: Upload Debt Manager APK
        uses: actions/upload-artifact@v4
        with:
          name: Debt-Manager-V2-Clean-APK
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
