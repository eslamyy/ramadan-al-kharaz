name: Build Ramadan Al Kharaz V19.1

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build APK V19.1
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find V19 project ZIP
        shell: bash
        run: |
          ZIP_FILE=$(find . -type f -name '*.zip' \
            | grep -Ei 'V19|19[._-]?1' \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "V19 project ZIP was not found"
            echo "Available ZIP files:"
            find . -type f -name '*.zip'
            exit 1
          fi

          echo "Selected project ZIP:"
          echo "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract project
        shell: bash
        run: |
          rm -rf extracted
          mkdir -p extracted

          unzip -q "$ZIP_FILE" -d extracted

          PROJECT_DIR=$(find extracted -type f -name 'settings.gradle' -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR=$(find extracted -type f -name 'settings.gradle.kts' -printf '%h\n' | head -n 1)
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "Android Gradle project was not found"
            find extracted -maxdepth 5 -type f
            exit 1
          fi

          echo "Android project directory:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        shell: bash
        run: |
          SDK_ROOT="/usr/local/lib/android/sdk"

          if [ ! -d "$SDK_ROOT" ]; then
            SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          fi

          if [ -z "$SDK_ROOT" ] || [ ! -d "$SDK_ROOT" ]; then
            echo "Android SDK was not found"
            exit 1
          fi

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/emulator" >> "$GITHUB_PATH"

          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -type f -name 'sdkmanager' | head -n 1)
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -f "$SDKMANAGER" ]; then
            echo "sdkmanager was not found"
            find "$SDK_ROOT" -type f -name 'sdkmanager' || true
            exit 1
          fi

          echo "Using sdkmanager:"
          echo "$SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" \
            'platform-tools' \
            'platforms;android-35' \
            'build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check project
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          echo "Project files:"
          ls -la

          if [ ! -f "settings.gradle" ] && [ ! -f "settings.gradle.kts" ]; then
            echo "settings.gradle was not found"
            exit 1
          fi

          if [ ! -f "build.gradle" ] && [ ! -f "build.gradle.kts" ]; then
            echo "build.gradle was not found"
            exit 1
          fi

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          gradle clean assembleDebug --stacktrace --no-daemon

      - name: Find generated APK
        shell: bash
        run: |
          APK_FILE=$(find "$PROJECT_DIR" -type f -name '*.apk' | head -n 1)

          if [ -z "$APK_FILE" ]; then
            echo "APK was not generated"
            find "$PROJECT_DIR" -type f | tail -100
            exit 1
          fi

          echo "Generated APK:"
          echo "$APK_FILE"

          echo "APK_FILE=$APK_FILE" >> "$GITHUB_ENV"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ramadan-Al-Kharaz-V19.1-FINAL-APK
          path: ${{ env.APK_FILE }}
          if-no-files-found: error
