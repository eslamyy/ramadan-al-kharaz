name: Build Ramadan Al Kharaz New Version

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Find project ZIP
        shell: bash
        run: |
          ZIP_FILE=$(find . -maxdepth 3 -type f \
            -name "Ramadan-Al-Kharaz-Center-FULL-INVOICE-SHARE.zip" \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "Project ZIP not found"
            echo "Available ZIP files:"
            find . -maxdepth 3 -type f -name "*.zip"
            exit 1
          fi

          echo "Found project ZIP:"
          echo "$ZIP_FILE"

