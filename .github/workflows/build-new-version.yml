name: Build Ramadan Al Kharaz V19.4

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/build-new-version.yml"

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Find project ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "لم يتم العثور على ملف ZIP"
            exit 1
          fi

          echo "تم العثور على الملف:"
          echo "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract project
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          unzip -q "$ZIP_FILE" -d extracted

          PROJECT_DIR=$(find extracted -type f -name "settings.gradle" -o -name "settings.gradle.kts" | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "لم يتم العثور على مشروع Android"
            find extracted -maxdepth 4 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_DIR")

          echo "مجلد المشروع:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

            - name: Prepare Android SDK
        shell: bash
        run: |
          set -e

          SDK_PATH="${ANDROID_HOME:-/usr/local/lib/android/sdk}"

          echo "ANDROID_HOME=$SDK_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_PATH" >> "$GITHUB_ENV"

          echo "مسار Android SDK:"
          echo "$SDK_PATH"

          SDKMANAGER=$(find "$SDK_PATH" -type f -name "sdkmanager" | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "لم يتم العثور على sdkmanager"
            exit 1
          fi

          echo "تم العثور على sdkmanager:"
          echo "$SDKMANAGER"

          chmod +x "$SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" "platform-tools"
          "$SDKMANAGER" "platforms;android-35"
          "$SDKMANAGER" "build-tools;35.0.0"
